services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_local
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:${RAG_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "127.0.0.1:${RAG_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
